services:
  postgres:
    image: postgres:16-alpine
    container_name: rulecraft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rulecraft
      POSTGRES_PASSWORD: rulecraft
      POSTGRES_DB: rulecraft_ai
    ports:
      - "5432:5432"
    volumes:
      - rulecraft_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rulecraft -d rulecraft_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rulecraft-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql://rulecraft:rulecraft@postgres:5432/rulecraft_ai?schema=public"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # VITE_API_URL must be a build arg, not a runtime `environment:` entry
      # — Vite inlines import.meta.env.VITE_* into the bundle when `vite
      # build` runs (inside the image build), which happens before any
      # container-runtime environment is applied. See frontend/Dockerfile.
      args:
        VITE_API_URL: "http://localhost:4000/api"
    container_name: rulecraft-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  rulecraft_pgdata:
